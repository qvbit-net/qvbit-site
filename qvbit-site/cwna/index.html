<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CWNA Practice">
<meta name="theme-color" content="#123746">
<title>CWNA-109 Practice Test</title>
<style>
:root{--navy:#123746;--teal:#54c7d9;--light:#f4f7fa;--border:#d9e1e6;--green:#e8f7ec;--red:#fff0f0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--light);color:#17212b;-webkit-text-size-adjust:100%;padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--navy);color:#fff;padding:calc(16px + env(safe-area-inset-top)) 16px 16px;position:sticky;top:0;z-index:10;box-shadow:0 2px 10px #0003}
.wrap{max-width:900px;margin:auto}
h1{margin:0 0 5px;font-size:24px;line-height:1.2}
.sub{opacity:.9;font-size:14px;line-height:1.4}
#progress{margin-top:12px;height:9px;background:#ffffff33;border-radius:20px;overflow:hidden}
#bar{height:100%;width:0;background:var(--teal);transition:.2s}
main{padding:16px 12px 120px}
.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px 16px;margin:0 auto 14px;max-width:900px;box-shadow:0 2px 8px #0000000c}
.qnum{font-weight:800;color:#16758a;margin-bottom:8px;font-size:15px}
.qtext{font-size:18px;line-height:1.48;margin-bottom:15px;font-weight:600}
.option{display:flex;gap:11px;align-items:flex-start;padding:15px 13px;border:1px solid #dfe6ea;border-radius:11px;margin:10px 0;cursor:pointer;min-height:52px;line-height:1.4;touch-action:manipulation}
.option:active{background:#eef9fb}
.option input{margin:3px 0 0;min-width:20px;min-height:20px;accent-color:#16758a}
.letter{font-weight:800;min-width:20px}
.correct{background:var(--green)!important;border-color:#4caf70!important}
.wrong{background:var(--red)!important;border-color:#e06a6a!important}
.answer-box{margin-top:15px;padding-top:13px;border-top:1px solid #e1e7ea}
.show-answer{width:100%;background:#eef7f9;color:#126276;border:1px solid #b9dbe2;padding:13px 14px;border-radius:9px;font-size:15px;font-weight:800;min-height:48px;touch-action:manipulation}
.answer-text{display:none;margin-top:10px;padding:12px;border-radius:9px;background:var(--green);border:1px solid #b7dfc2;font-weight:800;color:#205f34;line-height:1.4}
.actions{max-width:900px;margin:0 auto 15px;display:grid;grid-template-columns:1fr 1fr;gap:9px}
button{border:0;border-radius:9px;padding:13px 14px;font-weight:800;font-size:15px;min-height:48px;cursor:pointer;touch-action:manipulation}
.primary{background:var(--teal);color:#07313c}.secondary{background:#fff;color:var(--navy);border:1px solid #ccd8dd}
.actions button:first-child{grid-column:1/-1}
.result{display:none;position:fixed;left:0;right:0;bottom:0;background:var(--navy);color:white;padding:12px 14px calc(12px + env(safe-area-inset-bottom));z-index:20;box-shadow:0 -2px 10px #0003}
.result-inner{max-width:900px;margin:auto;display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center}
.score{font-size:19px;font-weight:800}.resultNote{font-size:13px}
.result-inner button{grid-column:2;grid-row:1/3}
@media(max-width:600px){
 h1{font-size:21px}.sub{font-size:13px}.qtext{font-size:17px}.card{padding:16px 13px;border-radius:12px}
 main{padding:12px 9px 130px}.option{font-size:16px;padding:15px 11px}
}
@media(min-width:601px){
 main{padding-top:22px}.actions{grid-template-columns:auto auto auto;justify-content:start}
 .actions button:first-child{grid-column:auto}
}
</style>
</head>
<body>
<header>
<div class="wrap">
<h1>CWNA-109 Practice Test</h1>
<div class="sub">128 questions • iPhone-friendly • Tap an answer or Show Answer</div>
<div id="progress"><div id="bar"></div></div>
</div>
</header>

<main>
<div class="actions">
<button class="primary" onclick="submitTest()">Submit Test</button>
<button class="secondary" onclick="resetTest()">Reset</button>
<button class="secondary" onclick="window.scrollTo({top:0,behavior:'smooth'})">Back to Top</button>
</div>
<div id="quiz"></div>
</main>

<div class="result" id="result">
<div class="result-inner">
<div class="score" id="score"></div>
<div class="resultNote" id="resultNote"></div>
<button class="secondary" onclick="resetTest()">Try Again</button>
</div>
</div>

<script>
const questions=[{"number": 1, "question": "Which formula should you use to calculate EIRP?", "options": [{"letter": "A", "text": "EIRP = Tx power (dBi) + antenna gain (dBm) – cable loss (dB)."}, {"letter": "B", "text": "EIRP = Tx power (dBm) + antenna gain (dBi) – cable loss (dB)."}, {"letter": "C", "text": "EIRP = Tx power (mW) + antenna gain (dBi) – cable loss (dB)."}, {"letter": "D", "text": "EIRP = Tx power (dB) + antenna gain (dBi) – cable loss (dBm)."}], "answer": ["B"]}, {"number": 2, "question": "Which device does not emit radio frequencies that can interfere with network APs.", "options": [{"letter": "A", "text": "wireless headphones"}, {"letter": "B", "text": "fluorescent light"}, {"letter": "C", "text": "motion detector"}, {"letter": "D", "text": "microwave oven"}, {"letter": "E", "text": "wireless video camera"}], "answer": ["B"]}, {"number": 3, "question": "What are the two factors of Free Space Path Loss that cause attenuation? (Choose two.)", "options": [{"letter": "A", "text": "distance"}, {"letter": "B", "text": "absorption"}, {"letter": "C", "text": "energy must be distributed in all directions"}, {"letter": "D", "text": "reflection"}, {"letter": "E", "text": "multipath"}], "answer": ["A", "C"]}, {"number": 4, "question": "Which two statements about comparing ZigBee with Bluetooth are true? (Choose two.)", "options": [{"letter": "A", "text": "The ZigBee device connection times are slower than Bluetooth."}, {"letter": "B", "text": "ZigBee and Bluetooth can create point-to-point links or very small networks."}, {"letter": "C", "text": "ZigBee power consumption is much higher than Bluetooth and is measured in Watts."}, {"letter": "D", "text": "The ZigBee range is longer than the Bluetooth range."}, {"letter": "E", "text": "The ZigBee data rate is lower than Bluetooth."}], "answer": ["D", "E"]}, {"number": 5, "question": "What factor does not influence the distance at which an RF signal can be effectively received?", "options": [{"letter": "A", "text": "Transmitting station’s output power"}, {"letter": "B", "text": "Receiving station’s output power"}, {"letter": "C", "text": "Free Space Path Loss"}, {"letter": "D", "text": "Receiving station’s radio sensitivity"}], "answer": ["B"]}, {"number": 6, "question": "What statement about the IEEE 802.11-2016 QoS facility is true?", "options": [{"letter": "A", "text": "802.11 control frames are assigned to the 802.11 EF priority queue"}, {"letter": "B", "text": "When the Voice queue has frames awaiting transmission, no data will be transmitted from the Best Effort queue."}, {"letter": "C", "text": "Four 802.1p user priorities are mapped to eight 802.11 transmit queues."}, {"letter": "D", "text": "802.11 QoS is achieved by giving high priority queues a statistical advantage at winning contention."}], "answer": ["D"]}, {"number": 7, "question": "You are performing a post-implementation validation survey. What basic tool can be used to easily locate areas of high co-channel interference?", "options": [{"letter": "A", "text": "Laptop-based spectrum analyzer"}, {"letter": "B", "text": "Access point spectrum analyzer"}, {"letter": "C", "text": "Throughput tester"}, {"letter": "D", "text": "Wi-Fi scanner"}], "answer": ["B"]}, {"number": 8, "question": "Which three statements about absorption are true? (Choose three.)", "options": [{"letter": "A", "text": "Absorption affects the radio wavelength and frequency."}, {"letter": "B", "text": "The presence of people affects absorption."}, {"letter": "C", "text": "Absorption takes energy from the wave and the energy is dissipated as heat in the obstacle."}, {"letter": "D", "text": "Dust and humidity in the air can negatively affect a radio signal."}, {"letter": "E", "text": "Absorption can add energy to the wave."}, {"letter": "F", "text": "A plasterboard wall absorbs the same amount of energy as a concrete wall."}, {"letter": "G", "text": "The absorption effect is inversely proportional to the density."}], "answer": ["B", "C", "D"]}, {"number": 9, "question": "To ease user complexity, your company has implemented a single SSID for all employees. However, the network administrator needs a way to control the network resources that can be accessed by each employee based in their department.", "options": [{"letter": "A", "text": "SNMP"}, {"letter": "B", "text": "WPA2"}, {"letter": "C", "text": "WIPS"}, {"letter": "D", "text": "RBAC"}], "answer": ["D"]}, {"number": 10, "question": "Which directional antenna types are commonly used by indoor Wi-Fi devices in a MIMO multiple spatial stream implementation?", "options": [{"letter": "A", "text": "Dipole and yagi"}, {"letter": "B", "text": "Dish and grid"}, {"letter": "C", "text": "Grid and sector"}, {"letter": "D", "text": "Patch and panel"}], "answer": ["D"]}, {"number": 11, "question": "When an ACK frame is not received by the transmitting STA, what is assumed?", "options": [{"letter": "A", "text": "The receiver is offline"}, {"letter": "B", "text": "The receiver processed the frame, but did not respond with an ACK frame because 802.11w is enabled"}, {"letter": "C", "text": "The frame was not delivered and must be retransmitted"}, {"letter": "D", "text": "The frame was correctly delivered"}], "answer": ["C"]}, {"number": 12, "question": "What primary metric of scanning can stations use to select the best AP for connectivity to the desired BSS?", "options": [{"letter": "A", "text": "FCS errors in frames transmitted to and from the AP."}, {"letter": "B", "text": "Throughput speed in Mbps."}, {"letter": "C", "text": "PING latency when testing against an Internet server."}, {"letter": "D", "text": "Signal strength of AP beacons received."}], "answer": ["D"]}, {"number": 13, "question": "When antenna gain is reported in dBI, the gain of the antenna is compared to what theoretical antenna?", "options": [{"letter": "A", "text": "Yagi"}, {"letter": "B", "text": "Isotropic radiator"}, {"letter": "C", "text": "Dipole"}, {"letter": "D", "text": "Rubber ducky"}], "answer": ["B"]}, {"number": 14, "question": "What statement about 802.3, Clause 33 Power over Ethernet is true?", "options": [{"letter": "A", "text": "Only midspan PSEs are supported."}, {"letter": "B", "text": "When using CAT5 cabling, you increase the maximum draw available to the PD over that available with CAT6."}, {"letter": "C", "text": "The lowest voltage drop is achieved when using CAT6 instead of Cat5 or CAT5e."}, {"letter": "D", "text": "Only endpoint PSEs are supported."}], "answer": ["C"]}, {"number": 15, "question": "Which two statements correctly describe reflection? (Choose two.)", "options": [{"letter": "A", "text": "The amplitude of a signal impacts how it is reflected."}, {"letter": "B", "text": "The angle of a reflected signal is the same as the angle of the signal received, with respect to the object"}, {"letter": "C", "text": "A rough material will always reflect more signal than a smooth one."}, {"letter": "D", "text": "If reflection occurs, no signal passes through the object."}, {"letter": "E", "text": "An obstacle may reflect a given signal differently depending on the signal’s frequency."}], "answer": ["B", "E"]}, {"number": 16, "question": "An IEEE 802.11 amendment is in the daft state. What impact does this draft amendment have on the 802.11 standard?", "options": [{"letter": "A", "text": "The standard is changed to reflect the new capabilities as soon as an amendment enters the draft stage."}, {"letter": "B", "text": "No impact: Until an amendment is ratified, it does not become part of the standard."}, {"letter": "C", "text": "Devices will be released based on the draft amendment and the draft amendment features are part of the standard."}, {"letter": "D", "text": "No impact: Draft amendments do not become part of the standard until a working group is formed."}], "answer": ["B"]}, {"number": 17, "question": "Which two statements about line-of-sight communication are true? (Choose two.)", "options": [{"letter": "A", "text": "A signal might reflect on an object and be successfully received in a place from which the sender cannot be seen"}, {"letter": "B", "text": "For a 6-foot person, the horizon appears at about 6 miles."}, {"letter": "C", "text": "Visual obstacles always prevent adequate line of sight."}, {"letter": "D", "text": "Visual line of sight is necessary for good signal transmission."}, {"letter": "E", "text": "The distance between the sender and receiver must be at least 25 miles apart for earth curvature to play a role in the quality of outdoor links"}], "answer": ["A", "B"]}, {"number": 18, "question": "iBeacon is Apple’s implementation of which technology?", "options": [{"letter": "A", "text": "SSID broadcasts"}, {"letter": "B", "text": "Ad hoc networking"}, {"letter": "C", "text": "BLE"}, {"letter": "D", "text": "IEEE 802.11"}], "answer": ["C"]}, {"number": 19, "question": "You are using a site survey tool for post-implementation validation. You have installed the appropriate adapter driver and imported a floor plan. Now, you want to take the next step in proper tool use. What must you do before gathering survey data after the floor plan is imported?", "options": [{"letter": "A", "text": "Install iPerf"}, {"letter": "B", "text": "Calibrate the floor plan"}, {"letter": "C", "text": "Nothing, you can simply start capturing signal readings"}, {"letter": "D", "text": "Install WinPCAP"}], "answer": ["B"]}, {"number": 20, "question": "What is the frequency of a radio wave that cycles 1000 times per second?", "options": [{"letter": "A", "text": "1 Mz"}, {"letter": "B", "text": "1000 Hz"}, {"letter": "C", "text": "1 GHz"}, {"letter": "D", "text": "10 KHz"}], "answer": ["B"]}, {"number": 21, "question": "Which three statements describe MRC characteristics? (Choose three.)", "options": [{"letter": "A", "text": "Any receiver AP can use this feature."}, {"letter": "B", "text": "The AP combines energies from multiple receive chains."}, {"letter": "C", "text": "The receiver evaluates the state of the channel for each signal that is received, and it will choose the best received signal for each symbol."}, {"letter": "D", "text": "The receiver AP must have multiple antennas to use this feature."}, {"letter": "E", "text": "The sending client must be 802.1n-capable."}, {"letter": "F", "text": "The transmitter combines energies into a single beam."}], "answer": ["B"]}, {"number": 22, "question": "What 802.11 PHY uses available space in very low frequency ranges that is not in use at the time by broadcast video signals?", "options": [{"letter": "A", "text": "DSSS"}, {"letter": "B", "text": "TVHT"}, {"letter": "C", "text": "SIG"}, {"letter": "D", "text": "DMG"}], "answer": ["B"]}, {"number": 23, "question": "An 802.11-based network uses an AP and has several connecting clients. The clients include iPhones, iPads, laptops and one desktop, What WLAN use case is represented?", "options": [{"letter": "A", "text": "WPAN"}, {"letter": "B", "text": "BSS"}, {"letter": "C", "text": "Ad-hoc"}, {"letter": "D", "text": "IBSS"}], "answer": ["B"]}, {"number": 24, "question": "The center frequency of channel 1 in the 2.4 GHz band is 2.412 GHz (2412 MHz). What is the center frequency of channel 4?", "options": [{"letter": "A", "text": "2.417"}, {"letter": "B", "text": "2.422"}, {"letter": "C", "text": "2.413"}, {"letter": "D", "text": "2.427"}], "answer": ["D"]}, {"number": 25, "question": "Which three statements about MIMO correctly describe its benefits? (Choose three.)", "options": [{"letter": "A", "text": "MIMO cannot be used with channel bonding."}, {"letter": "B", "text": "Combined with channel bonding, MIMO increases data throughput."}, {"letter": "C", "text": "When combined with channel bonding, MIMO may decrease data throughput."}, {"letter": "D", "text": "Better Rx sensitivity means a higher data rate (at a given distance from the AP)."}, {"letter": "E", "text": "MIMO provides better Rx sensitivity for a stationary client by using beamforming."}, {"letter": "F", "text": "MIMO provides better Tx sensitivity for the AP by using MRC."}, {"letter": "G", "text": "Better Tx sensitivity means a higher data rate (at a given distance from the AP)."}], "answer": ["B", "D", "E"]}, {"number": 26, "question": "The BSA of an AP covers the area used by the sales and marketing department. Thirty-five stations operate in this space. The users indicate that they need more throughput and all stations are 5 GHz capable 802.11ac clients. The current AP configuration uses 20 MHz channels in both 2.4 GHz and 5 GHz. What is the least expensive solution available for increasing throughput for these users without implementing configuration options that are not recommended?", "options": [{"letter": "A", "text": "Use a 40 MHz channel on the 2.4 GHz radio"}, {"letter": "B", "text": "Use a 160 MHz channel on the 5 GHz radio"}, {"letter": "C", "text": "Use a 40 MHz channel on the 5 GHz radio"}, {"letter": "D", "text": "Install a second AP in the coverage area"}], "answer": ["C"]}, {"number": 27, "question": "Which three antennas are examples of a directional antenna? (Choose three.)", "options": [{"letter": "A", "text": "patch"}, {"letter": "B", "text": "parabolic dish"}, {"letter": "C", "text": "monopole"}, {"letter": "D", "text": "dipole"}, {"letter": "E", "text": "omni"}, {"letter": "F", "text": "Yagi"}], "answer": ["A", "B", "F"]}, {"number": 28, "question": "What is the range of connectivity between NFC devices?", "options": [{"letter": "A", "text": "25 cm"}, {"letter": "B", "text": "10 cm"}, {"letter": "C", "text": "50 cm"}, {"letter": "D", "text": "1 cm"}], "answer": ["B"]}, {"number": 29, "question": "A dual-band 802.11ac AP must be powered by PoE. As a class 4 device, what power level should be received at the AP?", "options": [{"letter": "A", "text": "15.4 W"}, {"letter": "B", "text": "12.95 W"}, {"letter": "C", "text": "25.5 W"}, {"letter": "D", "text": "30 W"}], "answer": ["C"]}, {"number": 30, "question": "You are troubleshooting a client issue on a Windows laptop. The laptop can see and connect to 2.4 GHz APs, but is does not even see 5 GHz APs. While evaluating the issue, you determine that this problem is happening for all of the laptops of this model in the organization. Several other tablets connect on channel 48 and channel 52 in the same work areas. What is the likely problem?", "options": [{"letter": "A", "text": "The clients are configured to use WPA and 5 GHz channels only support WPA2."}, {"letter": "B", "text": "The antennas in the laptop have insufficient gain to detect the 5 GHz signals."}, {"letter": "C", "text": "The access points are configured to disallow 5 GHz."}, {"letter": "D", "text": "The client drivers are faulty and should be upgraded."}], "answer": ["B"]}, {"number": 31, "question": "You are attempting to locate the cause of a performance problem in two WLAN cells in a mostly overlapping coverage area. You note that one AP is on channel 1 and the other is on channel 2. When you document your findings, what term do you use to describe the problem in this configuration?", "options": [{"letter": "A", "text": "Bluetooth interference"}, {"letter": "B", "text": "ACI"}, {"letter": "C", "text": "Non-Wi-Fi interference"}, {"letter": "D", "text": "CCI"}], "answer": ["B"]}, {"number": 32, "question": "You have received a report of poor wireless connections on the third floor of a building under your administration. Three individuals have reported the problem. Apparently, the connections are reposting a strong signal, but the users cannot access the Internet. With the problem identified, what is the next logical step in the troubleshooting process?", "options": [{"letter": "A", "text": "Create a plan of action or escalate the problem"}, {"letter": "B", "text": "Perform corrective actions"}, {"letter": "C", "text": "Discover the scale of the problem"}, {"letter": "D", "text": "Verify the solution"}], "answer": ["C"]}, {"number": 33, "question": "A standard PoE injector is used to power an access point requiring 802.3at. CAT6 cabling is in use. What is the maximum distance supported between the access point and the Ethernet switch with the use of a midspan power injector?", "options": [{"letter": "A", "text": "200 meters"}, {"letter": "B", "text": "300 meters"}, {"letter": "C", "text": "100 meters"}, {"letter": "D", "text": "328 meters"}], "answer": ["C"]}, {"number": 34, "question": "Which statement correctly describes the coverage area of an omnidirectional antenna?", "options": [{"letter": "A", "text": "The H-plane coverage area is larger."}, {"letter": "B", "text": "Both planes are covered equally."}, {"letter": "C", "text": "The E-Plane coverage area is larger."}, {"letter": "D", "text": "It covers a 360-degree spherical area in one plane (usually the horizontal)."}], "answer": ["D"]}, {"number": 35, "question": "A client complains of low data rates on his computer. When you evaluate the situation, you see that the signal strength is -84 dBm and the noise floor is -96 dBm. The client is an 802.11ac client and connects to an 802.11acAP. Both the client and AP are 2x2:2 devices. What is the likely cause of the low data rate issue?", "options": [{"letter": "A", "text": "Lack of support 802.11n"}, {"letter": "B", "text": "Weak signal strength"}, {"letter": "C", "text": "Too few spatial streams"}, {"letter": "D", "text": "CAT5e cabling run to the AP"}], "answer": ["B"]}, {"number": 36, "question": "Which two statements are characteristics of WPA2-Enterprise authentication? (Choose two.)", "options": [{"letter": "A", "text": "Encryption uses TKIP and optional AES."}, {"letter": "B", "text": "A PSK is required."}, {"letter": "C", "text": "An authentication server is required."}, {"letter": "D", "text": "The EAP process is used to authenticate the client and server."}, {"letter": "E", "text": "RADIUS is used for backup authentication."}], "answer": ["C", "D"]}, {"number": 37, "question": "In WLAN security, what authentication method always creates Layer 2 dynamic encryption keys?", "options": [{"letter": "A", "text": "HTTPS captive portal"}, {"letter": "B", "text": "EAP-TLS"}, {"letter": "C", "text": "WEP"}, {"letter": "D", "text": "Shared Key"}], "answer": ["B"]}, {"number": 38, "question": "You are installing an AP to be used by 23 laptops. All laptops will connect on the 5 GHz frequency band. A neighbor network uses channels 1 and 6. What channel should be used for this AP and why?", "options": [{"letter": "A", "text": "A 5 GHz channel, because channels 1 and 6 are 2.4 GHz channels they have no impact on the decision"}, {"letter": "B", "text": "Channel 1, because it is best to use the channel with the lowest frequency"}, {"letter": "C", "text": "Channel 11, because channels 1 and 6 are in use nearby"}, {"letter": "D", "text": "Channel 6, because it is always best to use this channel"}], "answer": ["A"]}, {"number": 39, "question": "You are evaluating a connection that states the data rate is 150 Mbps. What is the expected throughput of this connection?", "options": [{"letter": "A", "text": "54 Mbps because that is the actual maximum throughput of an 802.11 connection"}, {"letter": "B", "text": "150 Mbps because the data rate is equal to the throughput"}, {"letter": "C", "text": "Less than 150 Mbps because of 802.11 overhead and contention"}, {"letter": "D", "text": "More than 150 Mbps because of compression"}], "answer": ["C"]}, {"number": 40, "question": "You are implementing a VHT-capable AP. Which one of the following channels is available in the 802.11-2016 standard that was not available before the ratification of 802.11 ac?", "options": [{"letter": "A", "text": "153"}, {"letter": "B", "text": "56"}, {"letter": "C", "text": "144"}, {"letter": "D", "text": "161"}], "answer": ["C"]}, {"number": 41, "question": "When a STA has authenticated to an AP (AP-1), but still maintains a connection with another AP (AP-2), what is the state of the STA on AP-1?", "options": [{"letter": "A", "text": "Authenticated and Associated"}, {"letter": "B", "text": "Unauthenticated and Unassociated"}, {"letter": "C", "text": "Authenticated and Unassociated"}, {"letter": "D", "text": "Transitional"}], "answer": ["C"]}, {"number": 42, "question": "Which device in a WLAN serves as the authenticator for 802.1X?", "options": [{"letter": "A", "text": "gateway router"}, {"letter": "B", "text": "AP or wireless LAN controller"}, {"letter": "C", "text": "switch"}, {"letter": "D", "text": "RADIUS server"}], "answer": ["B"]}, {"number": 43, "question": "Which two options are WPA, WPA2, and WPA3 authentication modes? (Choose two.)", "options": [{"letter": "A", "text": "independent"}, {"letter": "B", "text": "private"}, {"letter": "C", "text": "global"}, {"letter": "D", "text": "personal"}, {"letter": "E", "text": "enterprise"}], "answer": ["D", "E"]}, {"number": 44, "question": "A WLAN transmitter that emits a 50 mW signal is connected to a cable with 3 dB loss. If the cable is connected to an antenna with 9dBi gain, what is the EIRP at the antenna element?", "options": [{"letter": "A", "text": "13 dBm"}, {"letter": "B", "text": "23 dBm"}, {"letter": "C", "text": "10 dBm"}, {"letter": "D", "text": "26 dBm"}], "answer": ["B"]}, {"number": 45, "question": "A WLAN is implemented using wireless controllers. The APs must locate the controllers when powered on and connected to the network. Which one of the following methods is commonly used to locate the controllers by the APs?", "options": [{"letter": "A", "text": "DHCP"}, {"letter": "B", "text": "SNMP"}, {"letter": "C", "text": "NTP"}, {"letter": "D", "text": "GRE"}], "answer": ["A"]}, {"number": 46, "question": "During a post-implementation survey, you have detected a non-802.11 wireless device transmitting in the area used by handheld 802.11g scanners. What is the most important factor in determining the impact of this non-802.11 device?", "options": [{"letter": "A", "text": "Airtime utilization"}, {"letter": "B", "text": "Channel occupied"}, {"letter": "C", "text": "Protocols utilized"}, {"letter": "D", "text": "Receive sensitivity"}], "answer": ["A"]}, {"number": 47, "question": "What statement describes the authorization component of a AAA implementation?", "options": [{"letter": "A", "text": "Validating client device credentials against a database."}, {"letter": "B", "text": "Verifying that a user is who he says he is."}, {"letter": "C", "text": "Implementing a WIPS as a full-time monitoring solution to enforce policies."}, {"letter": "D", "text": "Granting access to specific network services or resources according to a user profile."}], "answer": ["D"]}, {"number": 48, "question": "You are planning for PoE in a standard office deployment. Which one of these devices is least likely to be a PoE PD?", "options": [{"letter": "A", "text": "VoIP phone"}, {"letter": "B", "text": "Ethernet switch"}, {"letter": "C", "text": "Video camera"}, {"letter": "D", "text": "Access point"}], "answer": ["B"]}, {"number": 49, "question": "You manage a WLAN with 100 802.11ac access points. All access points are configured to use 80 MHz channels. In a particular BSS, only 40 MHz communications are seen. What is the likely cause of this behavior?", "options": [{"letter": "A", "text": "All clients implement single spatial stream radios"}, {"letter": "B", "text": "The AP is improperly configured to use only 40 MHz of the 80 MHz allocated bandwidth"}, {"letter": "C", "text": "The clients are all 802.11n STAs or lower"}, {"letter": "D", "text": "The short guard interval is also enabled."}], "answer": ["C"]}, {"number": 50, "question": "Which UDP port number must firewalls allow to pass RADIUS authentication traffic between wireless LAN controllers and AAA servers?", "options": [{"letter": "A", "text": "port 1767"}, {"letter": "B", "text": "port 1876"}, {"letter": "C", "text": "port 1712"}, {"letter": "D", "text": "port 1812"}], "answer": ["D"]}, {"number": 51, "question": "What factor is likely to cause the least impact on the application layer throughput of an 802.11n client station in a 2.4 GHz HT BSS?", "options": [{"letter": "A", "text": "Implementation of several other clients in the same BSS using 802.11 g radios"}, {"letter": "B", "text": "RF interface from more than 10 nearby Bluetooth transmitters"}, {"letter": "C", "text": "Implementing Fast BSS Transition (FT) for roaming"}, {"letter": "D", "text": "Increasing or decreasing the number of spatial streams in use by the client station and AP"}], "answer": ["C"]}, {"number": 52, "question": "A natural disaster has occurred in a remote area that is approximately 40 miles from the response team headquarters. The response team must setup a local wireless network using 802.11 WLAN access points. What is the best method, of those listed, for implementation of a network backhaul for communications across the Internet in this scenario?", "options": [{"letter": "A", "text": "Temporary wired DSL"}, {"letter": "B", "text": "802.11 bridging"}, {"letter": "C", "text": "Temporary wired cable"}, {"letter": "D", "text": "Cellular/LTE"}], "answer": ["D"]}, {"number": 53, "question": "When a client station sends a broadcast probe request frame with a wildcard SSID, how do APs respond?", "options": [{"letter": "A", "text": "For each probe request frame, only one AP may reply with a probe response."}, {"letter": "B", "text": "After waiting a SIFS, all APs reply at the same time with a probe response."}, {"letter": "C", "text": "Each AP checks with the DHCP server to see if it can respond and then acts accordingly."}, {"letter": "D", "text": "Each AP responds in turn after preparing a probe response and winning contention."}], "answer": ["A"]}, {"number": 54, "question": "You are attempting to explain RF shadow and how it can cause lack of coverage. What common building item frequently causes RF shadow and must be accounted for in coverage plans?", "options": [{"letter": "A", "text": "Wooden doors"}, {"letter": "B", "text": "Carpeted floors"}, {"letter": "C", "text": "Cubicle partitions"}, {"letter": "D", "text": "Elevators"}], "answer": ["D"]}, {"number": 55, "question": "You are deploying a WLAN monitoring solution that utilizes distributed sensor devices. Where should sensors be deployed for best results?", "options": [{"letter": "A", "text": "In critical areas where WLAN performance must be high"}, {"letter": "B", "text": "Closer to the APs"}, {"letter": "C", "text": "Closer to the client devices"}, {"letter": "D", "text": "Every 20 feet and alongside each AP"}], "answer": ["C"]}, {"number": 56, "question": "What statement about the beamwidth of an RF antenna is true?", "options": [{"letter": "A", "text": "Horizontal and vertical beamwidth are calculated at the point where the main lobe decreases power by 3 dB."}, {"letter": "B", "text": "Vertical beamwidth is displayed (in degrees) on the antenna’s Azimuth chart."}, {"letter": "C", "text": "The beamwidth patterns on an antenna polar chart indicate the point at which the RF signal stops propagating."}, {"letter": "D", "text": "When antenna gain is lower, the beamwidth is also lower in both the horizontal and vertical dimensions."}], "answer": ["A"]}, {"number": 57, "question": "ABC Company is planning a point-to-multipoint bridge deployment with standalone (autonomous) 802.11 bridge units. 802.1X/EAP will be used for bridge authentication. A Linux-based RADIUS server will be used for authentication. What device in the bridge implementation acts as the 802.11X Authenticator?", "options": [{"letter": "A", "text": "The Ethernet switch"}, {"letter": "B", "text": "The root bridge"}, {"letter": "C", "text": "The RADIUS server"}, {"letter": "D", "text": "All non-root bridges"}], "answer": ["B"]}, {"number": 58, "question": "Lynne runs a small hotel, and as a value added for his customers he has implemented a Wi-Fi hotspot. Lynne has read news articles about how hackers wait at hotspots trying to take advantage of unsuspecting users. He wants to avoid this problem at his hotel. What is an efficient and practical step that Lynne can take to decrease the likelihood of active attacks on his customers wireless computers?", "options": [{"letter": "A", "text": "Require EAP_FAST authentication and provide customers with a username/password on their receipt."}, {"letter": "B", "text": "Implement an SSL VPN in the WLAN controller that initiates after HTTPS login."}, {"letter": "C", "text": "Enable station-to-station traffic blocking by the access points in the hotel."}, {"letter": "D", "text": "Implement Network Access Control (NAC) and require antivirus and firewall software along with OS patches."}], "answer": ["C"]}, {"number": 59, "question": "What non-standard WLAN solution attempts to give a longer transmission windows to devices with higher data rates than devices with lower data rates?", "options": [{"letter": "A", "text": "Band Steering"}, {"letter": "B", "text": "AirTime Faimess"}, {"letter": "C", "text": "RRM"}, {"letter": "D", "text": "ARM"}], "answer": ["B"]}, {"number": 60, "question": "The requirements for a WLAN you are installing state that it must support unidirectional delays of less than 150 ms and the signal strength at all receivers can be no lower than -67 dBm. What application is likely used that demands these requirements?", "options": [{"letter": "A", "text": "VoIP"}, {"letter": "B", "text": "E-Mail"}, {"letter": "C", "text": "RTLS"}, {"letter": "D", "text": "FTP"}], "answer": ["A"]}, {"number": 61, "question": "When compared with legacy Power Save mode, how does VHT TXOP power save improve battery life for devices on a WLAN?", "options": [{"letter": "A", "text": "VHT TXOP power save allows stations to enter sleep mode and legacy Power Save does not"}, {"letter": "B", "text": "Legacy Power Save mode was removed in the 802.11ac amendment."}, {"letter": "C", "text": "VHT TXOP power save allows the WLAN transceiver to disable more components when in a low power state."}, {"letter": "D", "text": "VHT TXOP power save uses the partial AID in the preamble to allow clients to identify frames targeted for them"}], "answer": ["D"]}, {"number": 62, "question": "Which three characteristics correctly describe EAP? (Choose three.)", "options": [{"letter": "A", "text": "supports multiple authentication methods"}, {"letter": "B", "text": "requires an AES encryption key of at least 128 bits"}, {"letter": "C", "text": "defines four message types: Request, Response, Success, and Failure"}, {"letter": "D", "text": "the type of packet and the direction are defined in the header to create stability and simplify the identity exchange"}, {"letter": "E", "text": "defines only two message types: Success and Failure"}], "answer": ["A", "C", "D"]}, {"number": 63, "question": "You are reporting on the RF environment in your facility. The manager asks you do describe the noise floor noted on the report. Which of the following is the best explanation?", "options": [{"letter": "A", "text": "The extra energy radiated by access points and client devices beyond that intended for the signal."}, {"letter": "B", "text": "The RF energy that exists in the environment from intentional and unintentional RF radiators that forms the baseline above which the Intentional signal of your WLAN must exist."}, {"letter": "C", "text": "The noise caused by elevators, microwave ovens, and video transmitters."}, {"letter": "D", "text": "The energy radiated by flooring materials that causes interference in the 2.4 GHz and 5 GHz bands."}], "answer": ["B"]}, {"number": 64, "question": "An RF sigma sometimes bends as it passes through some material other than free space. What is the term that describes this behavior?", "options": [{"letter": "A", "text": "Reflection"}, {"letter": "B", "text": "Warping"}, {"letter": "C", "text": "Refraction"}, {"letter": "D", "text": "Scattering"}], "answer": ["C"]}, {"number": 65, "question": "What security method is commonly used for VoIP handsets when the infrastructure does not support OKC or FT roaming?", "options": [{"letter": "A", "text": "WPA2-Personal"}, {"letter": "B", "text": "WPA2-Enterprise with PEAP"}, {"letter": "C", "text": "WPA2-Enterprise with EAP-TLS"}, {"letter": "D", "text": "WPA2-Enterprise with EAP-TTLS"}], "answer": ["A"]}, {"number": 66, "question": "You support a WLAN using dual-band 802.11ac three stream access points. All access points have both the 2.4 GHz and 5 GHz radios enabled and use 40 MHz channels in 5 GHz and 20 MHz channels in 2.4 GHz. A manager is concerned about the fact that each access point is connected using a 1 Gbps Ethernet link. He is concerned that the Ethernet link will not be able to handle the load from the wireless radios. What do you tell him?", "options": [{"letter": "A", "text": "His concern is invalid because the AP will compress all data before transmitting it onto the Ethernet link."}, {"letter": "B", "text": "His concern is valid and the company should immediately plan to run a second 1 Gbps Ethernet link to each AP."}, {"letter": "C", "text": "Due to 802.11 network operations and the dynamic rates used by devices on the network, the two radios will likely not exceed the 1 Gpbs Ethernet link."}, {"letter": "D", "text": "His concern is valid and the company should upgrade all Ethernet links to 10 Gbps immediately."}], "answer": ["C"]}, {"number": 67, "question": "Which one of the following 802.11 PHYs is more likely to be used in an industrial deployment but not likely to be used in standard office deployments?", "options": [{"letter": "A", "text": "HT"}, {"letter": "B", "text": "OFDM"}, {"letter": "C", "text": "SIG"}, {"letter": "D", "text": "VHT"}], "answer": ["C"]}, {"number": 68, "question": "You are the network administrator for XYZ Company. Your manager has recently attended a wireless security seminar. The seminar speaker taught that a wireless network could be hidden from potential intruders if you disable the broadcasting of the SSID in Beacons and configured the access points not to respond to Probe Request frames that have a null SSID field. Your manager suggests implementing these security practices. What response should you give to this suggestion?", "options": [{"letter": "A", "text": "Any 802.11 protocol analyzer can see the SSID in clear text in frames other than Beacons frames. This negates any security benefit of trying to hide the SSID in Beacons and Probe Response frames"}, {"letter": "B", "text": "This security practice prevents manufacturers’ client utilities from detecting the SSID. As a result, the SSID cannot be obtained by attackers, except through"}, {"letter": "C", "text": "To improve security by hiding the SSID, the AP and client stations must both be configured to remove the SSID from association request and response frames. Most VLAN products support this."}, {"letter": "D", "text": "Any tenants in the same building using advanced penetration testing tools will be able to obtain the SSID by exploiting WPA EAPOL-Key exchanges. This poses an additional risk of exposing the WPA key."}], "answer": ["A"]}, {"number": 69, "question": "You are troubleshooting a WLAN problem and you suspect hidden node as the cause. What should you look for in a protocol analyzer?", "options": [{"letter": "A", "text": "Frames with the retry bit set to 0"}, {"letter": "B", "text": "Frames with the HN bit set to 1"}, {"letter": "C", "text": "Frames transmitted from the AP without acknowledgement"}, {"letter": "D", "text": "Retransmitted frames from multiple STAs at higher rates than other STAs"}], "answer": ["D"]}, {"number": 70, "question": "In a long-distance RF link, which statement about Fade Margin is true?", "options": [{"letter": "A", "text": "The Fade Margin of a long-distance radio link should be equivalent to the receiver’s low noise filter gain."}, {"letter": "B", "text": "A Fade Margin is unnecessary on a long-distance RF link if more than 80%"}, {"letter": "C", "text": "Fade Margin is an additional pad of signal strength designed into the RF system to compensate for unpredictable signal fading"}, {"letter": "D", "text": "The Fade Margin is a measurement of signal loss through free space and is a function of frequency and distance"}], "answer": ["C"]}, {"number": 71, "question": "A client STA must choose the best AP for connectivity. As part of the evaluation, it must verify compatible data rates. What can the client STA use to verify that an AP supports the same data rates that it supports?", "options": [{"letter": "A", "text": "Authentication frames transmitted by the other client STAs"}, {"letter": "B", "text": "Probe request frames transmitted by other client STAs"}, {"letter": "C", "text": "Beacon frames transmitted by the AP"}, {"letter": "D", "text": "Data frames sent between the AP and current clients STAs"}], "answer": ["C"]}, {"number": 72, "question": "Which three statements correctly describe how PKI is used in an enterprise WLAN? (Choose three.)", "options": [{"letter": "A", "text": "Clients can request a user certificate from a CA and use the certificate to authenticate to the server using IEEE 802.1X authentication"}, {"letter": "B", "text": "CAs are used to generate digital certificates for users (clients) and servers."}, {"letter": "C", "text": "Servers request a server certificate from the CA that the client uses to validate the authenticity of the server."}, {"letter": "D", "text": "WLANs do not support the use of PKI and CA."}, {"letter": "E", "text": "WLAN PKI can only use real Internet CAs."}, {"letter": "F", "text": "WLAN PKI demands that users and servers have certificates."}], "answer": ["A", "B", "C"]}, {"number": 73, "question": "You are implementing a multi-AP WLAN and fast secure roaming is essential. Which one of the following methods is an IEEE 802.11 standard method for fast roaming? FT", "options": [{"letter": "A", "text": "FT"}, {"letter": "B", "text": "OKC"}, {"letter": "C", "text": "Load balancing"}, {"letter": "D", "text": "Band steering"}], "answer": ["A"]}, {"number": 74, "question": "You are managing a wireless access point in autonomous mode using the Web based interface. You capture traffic during this management task and notice that you can see the HTML code of the Web pages for access point management. What error in administration could be the cause of the security concern?", "options": [{"letter": "A", "text": "HTTP is in use instead of HTTPS"}, {"letter": "B", "text": "A VPN with the AP is not established"}, {"letter": "C", "text": "WPA2 is disabled on the WLAN"}, {"letter": "D", "text": "IPsec is not in use of the management connection as recommended"}], "answer": ["A"]}, {"number": 75, "question": "Which one of the following is not a factor considered when calculating the Link Budget for an outdoor point- to-point WLAN bridge link?", "options": [{"letter": "A", "text": "Receive antenna gain"}, {"letter": "B", "text": "Transmit power"}, {"letter": "C", "text": "MU-MIMO capabilities of the bridges"}, {"letter": "D", "text": "Operating frequency"}], "answer": ["C"]}, {"number": 76, "question": "A non-802.11 device is suspected of causing interference on the WLAN. You are not certain of the location or type of device. What is the best solution for locating this non-802.11 device?", "options": [{"letter": "A", "text": "Laptop-based spectrum analyzer with a directional antenna."}, {"letter": "B", "text": "Laptop-based spectrum analyzer with an omni-directional antenna"}, {"letter": "C", "text": "Laptop-based spectrum analyzer with an omni-directional antenna."}, {"letter": "D", "text": "Access point spectrum analyzer"}], "answer": ["A"]}, {"number": 77, "question": "What common feature of MDM solutions can be used to protect enterprise data on mobile devices?", "options": [{"letter": "A", "text": "Over-the-air registration"}, {"letter": "B", "text": "Self-registration"}, {"letter": "C", "text": "Containerization"}, {"letter": "D", "text": "Onboarding"}], "answer": ["D"]}, {"number": 78, "question": "What Linux shell command can be used to view the hardware and PHY capabilities of a wireless adapter in detail including channel widths, output power settings, channels supported, and more?", "options": [{"letter": "A", "text": "iw phy"}, {"letter": "B", "text": "ifconfig"}, {"letter": "C", "text": "iwconfig"}, {"letter": "D", "text": "netsh wlan show device"}], "answer": ["C"]}, {"number": 79, "question": "Which of the following tools can do Spectrum Analysis? (Choose two.)", "options": [{"letter": "A", "text": "MetaGeek InSSIDer"}, {"letter": "B", "text": "Cisco Spectrum Expert"}, {"letter": "C", "text": "Cisco PI"}, {"letter": "D", "text": "Wireshark"}, {"letter": "E", "text": "MetaGeek Chanalyzer"}], "answer": ["B", "E"]}, {"number": 80, "question": "You administer a small WLAN with nine access points. As a small business, you do not run a RADIUS server and use WPA2-Personal for security. Recently, you changed the passphrase for WPA2-Personal in all APs and clients. Several users are now reporting the inability to connect to the network at times and it is constrained to one area of the building. When using a WLAN scanner, you see that the AP covering that area is online and has a strong signal. No other changes have been made to the environment and all access points are the same model. What is the likely problem?", "options": [{"letter": "A", "text": "The AP that covers the problem area requires a firmware update"}, {"letter": "B", "text": "The clients are improperly configured"}, {"letter": "C", "text": "The AP that covers the problem area has failed"}, {"letter": "D", "text": "The AP that covers the problem area is improperly configured"}], "answer": ["D"]}, {"number": 81, "question": "You are troubleshooting a client problem with a 2.4 GHz WLAN connection. The client is experiencing surprisingly low data rates during the work day. You analyze the workspace outside of business hours and detect a strong signal with a typical noise floor at the client location. During working hours, the user works with a laptop in the area and uses an external USB hard drive for continuous data access. The user also states that the laptop works as expected on her home network. The user working approximately 8 feet away from this client experiences no problems. Based on this information, what is the likely cause of the problem?", "options": [{"letter": "A", "text": "The AP is overloaded during the work day"}, {"letter": "B", "text": "The laptop has a failing wireless adapter"}, {"letter": "C", "text": "The external hard drive is USB 3.0 and is causing a significant increase in the noise floor when in use"}, {"letter": "D", "text": "The drives in the laptop are corrupt"}], "answer": ["C"]}, {"number": 82, "question": "What statement is true concerning the use of Orthogonal Frequency Division Multiplexing (OFDM) modulation method in IEEE 802.11 WLANs?", "options": [{"letter": "A", "text": "OFDM was used by Frequency Hopping Spread Spectrum (FHSS) PHY devices."}, {"letter": "B", "text": "OFDM implement BPSK modulation to allow for data rates up to 7 Gbps."}, {"letter": "C", "text": "OFDM modulation is used only in 5 GHz 802.11 transmissions."}, {"letter": "D", "text": "OFDM was first introduced in 802.11 and is used by the ERP, HT and VHT PHYs as well."}], "answer": ["D"]}, {"number": 83, "question": "What ID is typically mapped to an AP’s MAC address if a single BSS is implemented?", "options": [{"letter": "A", "text": "SSID"}, {"letter": "B", "text": "Device ID"}, {"letter": "C", "text": "BSSID"}, {"letter": "D", "text": "VLAN ID"}], "answer": ["C"]}, {"number": 84, "question": "What security solution is deprecated in the 802.11 standard and should never be used in any modern WLAN deployment?", "options": [{"letter": "A", "text": "CCMP"}, {"letter": "B", "text": "AES"}, {"letter": "C", "text": "Shared Key Authentication"}, {"letter": "D", "text": "Open System Authentication"}], "answer": ["C"]}, {"number": 85, "question": "You administer a WLAN that offers a guest SSID of GUESTNWORK. Users connect to the GUESTNWORK SSID, but report that they cannot browse the Internet. The devices simply report no Internet connection. What common problem causes this scenario?", "options": [{"letter": "A", "text": "IP routing issues"}, {"letter": "B", "text": "Hardware issues"}, {"letter": "C", "text": "Captive portal issues"}, {"letter": "D", "text": "NTP issues"}], "answer": ["A"]}, {"number": 86, "question": "What statement about 802.11 WLAN performance is true?", "options": [{"letter": "A", "text": "In modem networks, both centralized and distributed data forwarding work well for most standard office deployments"}, {"letter": "B", "text": "To get the best performance out of an AP, you should disable data rates of 72 Mbps and lower"}, {"letter": "C", "text": "WLANs perform better as more wireless clients connect with each AP"}, {"letter": "D", "text": "In most WLANs, no special skill or tuning is required to get peak performance"}], "answer": ["A"]}, {"number": 87, "question": "You have been tasked with creating a wireless link between two buildings on a single campus. The link must support at least 150 Mbps data rates. What kind of WLAN technology role should you deploy?", "options": [{"letter": "A", "text": "Access BSS"}, {"letter": "B", "text": "WPAN"}, {"letter": "C", "text": "Wireless bridging"}, {"letter": "D", "text": "IBSS"}], "answer": ["C"]}, {"number": 88, "question": "What is the final step in an effective troubleshooting process?", "options": [{"letter": "A", "text": "Notify the users of problem resolution"}, {"letter": "B", "text": "Verify the solution"}, {"letter": "C", "text": "Document the results"}, {"letter": "D", "text": "Disable the WLAN"}], "answer": ["C"]}, {"number": 89, "question": "You are deploying a WLAN with the access points configured for 10 mW of output power on the 2.4 GHz radios and 20mW of output power on the 5GHz radios. Some semi-directional antennas are also in use. What kind of deployment is described?", "options": [{"letter function esc(s){
 return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function renderQuiz(){
 const quiz=document.getElementById('quiz'); quiz.innerHTML='';
 questions.forEach((q,qi)=>{
  const multi=q.answer.length>1, card=document.createElement('section');
  card.className='card'; card.dataset.q=qi;
  card.innerHTML=
   `<div class="qnum">Question ${q.number}${multi?' — Choose '+q.answer.length:''}</div>`+
   `<div class="qtext">${esc(q.question)}</div>`+
   q.options.map(o=>`<label class="option" data-letter="${o.letter}">
   <input type="${multi?'checkbox':'radio'}" name="q${qi}" value="${o.letter}" onchange="updateProgress()">
   <span class="letter">${o.letter}.</span><span>${esc(o.text)}</span></label>`).join('')+
   `<div class="answer-box">
   <button class="show-answer" type="button" onclick="showAnswer(${qi})">Show Answer</button>
   <div class="answer-text" id="answer-${qi}">Correct Answer: ${q.answer.join(', ')}</div>
   </div>`;
  quiz.appendChild(card);
 });
 updateProgress();
}
function showAnswer(qi){
 const el=document.getElementById('answer-'+qi);
 el.style.display=el.style.display==='block'?'none':'block';
}
function updateProgress(){
 let answered=0;
 questions.forEach((q,qi)=>{
  if(document.querySelectorAll(`input[name="q${qi}"]:checked`).length) answered++;
 });
 document.getElementById('bar').style.width=(answered/questions.length*100)+'%';
}
function submitTest(){
 let correct=0,answered=0;
 questions.forEach((q,qi)=>{
  const card=document.querySelector(`[data-q="${qi}"]`);
  const selected=[...document.querySelectorAll(`input[name="q${qi}"]:checked`)].map(x=>x.value).sort();
  const expected=[...q.answer].sort();
  if(selected.length) answered++;
  const ok=selected.length===expected.length && selected.every((v,i)=>v===expected[i]);
  if(ok) correct++;
  card.querySelectorAll('.option').forEach(el=>{
   el.classList.remove('correct','wrong');
   if(q.answer.includes(el.dataset.letter)) el.classList.add('correct');
   if(selected.includes(el.dataset.letter)&&!q.answer.includes(el.dataset.letter)) el.classList.add('wrong');
  });
  document.getElementById('answer-'+qi).style.display='block';
 });
 const pct=Math.round(correct/questions.length*100);
 document.getElementById('score').textContent=`Score: ${correct}/${questions.length} (${pct}%)`;
 document.getElementById('resultNote').textContent=`Answered: ${answered}/${questions.length}`;
 document.getElementById('result').style.display='block';
 window.scrollTo({top:0,behavior:'smooth'});
}
function resetTest(){
 document.getElementById('result').style.display='none';
 renderQuiz();
 window.scrollTo({top:0,behavior:'smooth'});
}
renderQuiz();
</script>
