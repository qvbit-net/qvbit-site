name: Add Customer 360
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update main.jsx
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('qvbit-site/crm/src/main.jsx')
          s=p.read_text(encoding='utf-8')
          if "import Customer360 from './components/Customer360'" not in s:
              s=s.replace("import MspAssetsContracts from './components/MspAssetsContracts'\n", "import MspAssetsContracts from './components/MspAssetsContracts'\nimport Customer360 from './components/Customer360'\n", 1)
          if "  '/crm/customer-360': 'customers'," not in s:
              s=s.replace("  '/crm/assets-contracts': 'services',\n", "  '/crm/assets-contracts': 'services',\n  '/crm/customer-360': 'customers',\n", 1)
          if "to: '/crm/customer-360'" not in s:
              marker="  {\n    to: '/crm/assets-contracts',\n    label: 'Assets & Contracts',\n    icon: Package,\n  },\n"
              insert="  {\n    to: '/crm/customer-360',\n    label: 'Customer 360',\n    icon: Building2,\n  },\n"
              if marker not in s: raise SystemExit('nav marker not found')
              s=s.replace(marker, marker+insert, 1)
          if 'path="customer-360"' not in s:
              marker="            <Route\n              path=\"assets-contracts\"\n              element={<MspAssetsContracts />}\n            />\n\n"
              insert="            <Route\n              path=\"customer-360\"\n              element={<Customer360 />}\n            />\n\n"
              if marker not in s: raise SystemExit('route marker not found')
              s=s.replace(marker, marker+insert, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Build CRM
        working-directory: qvbit-site/crm
        run: npm install --no-audit --no-fund && npm run build
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/add-customer-360.yml
          git add qvbit-site/crm/src/main.jsx
          git commit -m 'Add Customer 360 to CRM'
          git push
