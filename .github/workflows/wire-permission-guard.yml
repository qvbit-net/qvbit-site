name: Wire CRM permission guard

on:
  push:
    paths:
      - '.github/workflows/wire-permission-guard.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add guard import
        shell: python
        run: |
          from pathlib import Path
          path = Path('qvbit-site/crm/src/main.jsx')
          text = path.read_text(encoding='utf-8')
          import_line = "import PermissionRouterGuard from './components/PermissionRouterGuard'"
          if import_line not in text:
              anchor = "import SettingsUsers from './components/SettingsUsers'\n"
              if anchor not in text:
                  raise SystemExit('SettingsUsers import anchor not found')
              text = text.replace(anchor, anchor + import_line + '\n', 1)
              path.write_text(text, encoding='utf-8')
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qvbit-site/crm/src/main.jsx
          git rm .github/workflows/wire-permission-guard.yml
          git diff --cached --quiet || git commit -m 'Wire CRM permission guard'
          git push
