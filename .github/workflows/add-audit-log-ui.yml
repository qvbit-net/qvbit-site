name: Wire Owner audit log into CRM settings

on:
  push:
    branches: [main]

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update main.jsx
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('qvbit-site/crm/src/main.jsx')
          text = path.read_text(encoding='utf-8')
          old = "import SettingsUsers from './components/SettingsUsers'\nimport PermissionRouterGuard"
          new = "import SettingsUsers from './components/SettingsUsers'\nimport SettingsAuditLog from './components/SettingsAuditLog'\nimport PermissionRouterGuard"
          if "import SettingsAuditLog from './components/SettingsAuditLog'" not in text:
              if old not in text:
                  raise SystemExit('SettingsUsers import anchor not found')
              text = text.replace(old, new, 1)

          old_nav = """          {(!roleReady || isOwner) && (\n            <NavItem\n              to=\"/crm/settings\"\n              label=\"Settings\"\n              icon={Settings}\n              onNavigate={() =>\n                setMobileOpen(false)\n              }\n            />\n          )}"""
          new_nav = """          {(!roleReady || isOwner) && (\n            <>\n              <NavItem\n                to=\"/crm/settings\"\n                label=\"Settings\"\n                icon={Settings}\n                onNavigate={() =>\n                  setMobileOpen(false)\n                }\n              />\n              {isOwner && (\n                <NavItem\n                  to=\"/crm/settings/audit-log\"\n                  label=\"Audit Log\"\n                  icon={ShieldCheck}\n                  onNavigate={() =>\n                    setMobileOpen(false)\n                  }\n                />\n              )}\n            </>\n          )}"""
          if 'to="/crm/settings/audit-log"' not in text:
              if old_nav not in text:
                  raise SystemExit('settings nav anchor not found')
              text = text.replace(old_nav, new_nav, 1)

          old_route = """            <Route\n              path=\"settings\"\n              element={<SettingsUsers />}\n            />"""
          new_route = """            <Route\n              path=\"settings/audit-log\"\n              element={<SettingsAuditLog />}\n            />\n\n            <Route\n              path=\"settings\"\n              element={<SettingsUsers />}\n            />"""
          if 'path="settings/audit-log"' not in text:
              if old_route not in text:
                  raise SystemExit('settings route anchor not found')
              text = text.replace(old_route, new_route, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Build CRM
        working-directory: qvbit-site/crm
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Commit changes and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qvbit-site/crm/src/main.jsx
          git commit -m 'Add Owner audit log navigation and route' || true
          git push
          git rm .github/workflows/add-audit-log-ui.yml
          git commit -m 'Remove temporary audit log workflow' || true
          git push
