name: Add sales workflow center
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update main.jsx
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('qvbit-site/crm/src/main.jsx')
          s=p.read_text(encoding='utf-8')
          if "import WorkflowCenter from './components/WorkflowCenter'" not in s:
              s=s.replace("import SettingsAuditLog from './components/SettingsAuditLog'\n", "import SettingsAuditLog from './components/SettingsAuditLog'\nimport WorkflowCenter from './components/WorkflowCenter'\n", 1)
          if "  '/crm/workflow': 'workflow'," not in s:
              s=s.replace("  '/crm/follow-ups': 'follow_ups',\n", "  '/crm/follow-ups': 'follow_ups',\n  '/crm/workflow': 'workflow',\n", 1)
          if "to: '/crm/workflow'" not in s:
              marker="  {\n    to: '/crm/activity',\n    label: 'Activity',\n    icon: Activity,\n  },\n"
              insert="  {\n    to: '/crm/workflow',\n    label: 'Sales Workflow',\n    icon: ArrowUpRight,\n  },\n"
              if marker not in s: raise SystemExit('nav marker not found')
              s=s.replace(marker, insert+marker, 1)
          if 'path="workflow"' not in s:
              route_marker="            <Route\n              path=\"follow-ups\"\n              element={<FollowUps />}\n            />\n\n"
              route_insert="            <Route\n              path=\"workflow\"\n              element={<WorkflowCenter />}\n            />\n\n"
              if route_marker not in s: raise SystemExit('route marker not found')
              s=s.replace(route_marker, route_marker+route_insert, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Build CRM
        working-directory: qvbit-site/crm
        run: npm install --no-audit --no-fund && npm run build
      - name: Commit changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/add-workflow-center.yml
          git add qvbit-site/crm/src/main.jsx
          if git diff --cached --quiet; then
            echo 'No changes to publish.'
            exit 0
          fi
          git commit -m 'Add sales workflow center'
          git push
