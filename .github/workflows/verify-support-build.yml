name: Verify QVB I.T. support build

on:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build deployment
        working-directory: qvbit-site
        run: bash build.sh
      - name: Verify support page output
        working-directory: qvbit-site
        run: |
          test -f _site/support.html
          grep -q "QVB I.T. Support" _site/support.html
          grep -q "Submit Support Request" _site/support.html
          test -f _site/crm/index.html
      - name: Remove temporary workflow
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/verify-support-build.yml
          git commit -m "Remove temporary support build verification"
          git push origin HEAD:main
