name: Fix invoice amount paid calculation
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix InvoiceDetail calculation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('qvbit-site/crm/src/main.jsx')
          s=p.read_text(encoding='utf-8')

          old_save="""    if (amountPaid > total && form.status !== 'void') {
      setError('Amount paid cannot be greater than the invoice total.')
      setSaving(false)
      return
    }

    const payload = {
      invoice_number: form.invoice_number.trim() || null,
      customer_id: form.customer_id,
      job_id: form.job_id || null,
      status: form.status,
"""
          new_save="""    if (amountPaid > total && form.status !== 'void') {
      setError('Amount paid cannot be greater than the invoice total.')
      setSaving(false)
      return
    }

    const calculatedStatus = form.status === 'void'
      ? 'void'
      : (amountPaid >= total && total > 0)
        ? 'paid'
        : amountPaid > 0
          ? 'partial'
          : ['paid', 'partial'].includes(form.status)
            ? 'sent'
            : form.status

    const payload = {
      invoice_number: form.invoice_number.trim() || null,
      customer_id: form.customer_id,
      job_id: form.job_id || null,
      status: calculatedStatus,
"""
          if old_save not in s: raise SystemExit('save block not found')
          s=s.replace(old_save,new_save,1)

          marker="""  async function remove() {
"""
          insertion="""  const liveTotal = Number(form.total || 0)
  const liveAmountPaid = Number(form.amount_paid || 0)
  const liveBalanceDue = Math.max(liveTotal - liveAmountPaid, 0)
  const liveInvoiceStatus = form.status === 'void'
    ? 'void'
    : (liveAmountPaid >= liveTotal && liveTotal > 0)
      ? 'paid'
      : liveAmountPaid > 0
        ? 'partial'
        : ['paid', 'partial'].includes(form.status)
          ? 'sent'
          : form.status

"""
          if 'const liveBalanceDue' not in s:
              if marker not in s: raise SystemExit('remove marker not found')
              s=s.replace(marker,insertion+marker,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Build CRM
        working-directory: qvbit-site/crm
        run: npm install --no-audit --no-fund && npm run build
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qvbit-site/crm/src/main.jsx
          git diff --cached --quiet || git commit -m 'Fix invoice amount paid calculation'
          git rm .github/workflows/fix-invoice-amount-paid-calculation.yml
          git commit -m 'Remove invoice amount paid calculation workflow'
          git push
