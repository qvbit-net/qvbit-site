name: Fix customer email section placement

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-customer-email-section-placement.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct email section location
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('qvbit-site/crm/src/main.jsx')
          text = path.read_text(encoding='utf-8')

          # Remove the wrapper that the previous patch accidentally placed in Dashboard.
          start = text.find('<div className="customer-email-grid-item">')
          if start < 0:
              raise SystemExit('Existing customer email placement wrapper not found')
          tag_re = re.compile(r'<div\b[^>]*>|</div>')
          depth = 0
          end = None
          for m in tag_re.finditer(text, start):
              tag = m.group(0)
              if tag.startswith('<div') and not tag.rstrip().endswith('/>'):
                  depth += 1
              elif tag == '</div>':
                  depth -= 1
                  if depth == 0:
                      end = m.end()
                      break
          if end is None:
              raise SystemExit('Could not find end of misplaced customer email wrapper')
          email_block = text[start:end].strip() + '\n'
          text = text[:start] + text[end:]

          customer_pos = text.find('function CustomerDetail()')
          if customer_pos < 0:
              raise SystemExit('CustomerDetail function not found')
          section_marker = text.find('/* BUSINESS + CONTACT */', customer_pos)
          if section_marker < 0:
              raise SystemExit('CustomerDetail business/contact section not found')

          grid_marker = text.find("gridTemplateColumns:\n                'repeat(auto-fit, minmax(300px, 1fr))'", section_marker)
          if grid_marker < 0:
              raise SystemExit('CustomerDetail business/contact grid not found')
          grid_open = text.rfind('<div', section_marker, grid_marker)
          if grid_open < 0:
              raise SystemExit('CustomerDetail business/contact grid opening tag not found')

          depth = 0
          grid_end = None
          for m in tag_re.finditer(text, grid_open):
              tag = m.group(0)
              if tag.startswith('<div') and not tag.rstrip().endswith('/>'):
                  depth += 1
              elif tag == '</div>':
                  depth -= 1
                  if depth == 0:
                      grid_end = m.start()
                      break
          if grid_end is None:
              raise SystemExit('Could not find CustomerDetail business/contact grid end')

          # The wrapper already contains the {!editing && (...)} guard.
          text = text[:grid_end] + '\n' + email_block + text[grid_end:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Build and verify
        working-directory: qvbit-site
        run: |
          bash build.sh
          test "$(grep -c '<EmailAddressManager' crm/src/main.jsx)" -eq 1
          test "$(grep -c 'customer-email-grid-item' crm/src/main.jsx)" -eq 1
          test -f _site/crm/index.html

      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qvbit-site/crm/src/main.jsx
          git rm .github/workflows/fix-customer-email-section-placement.yml
          git commit -m "Place customer email section under contact information"
          git push origin HEAD:main
