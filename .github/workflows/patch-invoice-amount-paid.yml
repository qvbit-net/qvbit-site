{
  "name": "Enable editable invoice amount paid",
  "on": {"push": {"branches": ["main"]}},
  "permissions": {"contents": "write"},
  "jobs": {
    "patch": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {"uses": "actions/checkout@v4"},
        {
          "name": "Patch InvoiceDetail",
          "shell": "bash",
          "run": "python3 - <<'PY'\nfrom pathlib import Path\np=Path('qvbit-site/crm/src/main.jsx')\ns=p.read_text(encoding='utf-8')\nold_save=\"\"\"    if (amountPaid > total && form.status !== 'void') {\n      setError('Amount paid cannot be greater than the invoice total.')\n      setSaving(false)\n      return\n    }\n\n    const payload = {\n      invoice_number: form.invoice_number.trim() || null,\n      customer_id: form.customer_id,\n      job_id: form.job_id || null,\n      status: form.status,\n\"\"\"\nnew_save=\"\"\"    if (amountPaid > total && form.status !== 'void') {\n      setError('Amount paid cannot be greater than the invoice total.')\n      setSaving(false)\n      return\n    }\n\n    const calculatedStatus = form.status === 'void'\n      ? 'void'\n      : (amountPaid >= total && total > 0)\n        ? 'paid'\n        : amountPaid > 0\n          ? 'partial'\n          : ['paid', 'partial'].includes(form.status)\n            ? 'sent'\n            : form.status\n\n    const payload = {\n      invoice_number: form.invoice_number.trim() || null,\n      customer_id: form.customer_id,\n      job_id: form.job_id || null,\n      status: calculatedStatus,\n\"\"\"\nif old_save not in s: raise SystemExit('invoice save block not found')\ns=s.replace(old_save,new_save,1)\nold_return=\"\"\"  return (\n    <>\n      <div style={{ marginBottom: '18px' }}>\n\"\"\"\nnew_return=\"\"\"  const liveTotal = Number(form.total || 0)\n  const liveAmountPaid = Number(form.amount_paid || 0)\n  const liveBalanceDue = Math.max(liveTotal - liveAmountPaid, 0)\n  const liveInvoiceStatus = form.status === 'void'\n    ? 'void'\n    : (liveAmountPaid >= liveTotal && liveTotal > 0)\n      ? 'paid'\n      : liveAmountPaid > 0\n        ? 'partial'\n        : ['paid', 'partial'].includes(form.status)\n          ? 'sent'\n          : form.status\n\n  return (\n    <>\n      <div style={{ marginBottom: '18px' }}>\n\"\"\"\nif old_return not in s: raise SystemExit('InvoiceDetail return block not found')\ns=s.replace(old_return,new_return,1)\nold_amount=\"\"\"            <label>\n              Amount paid\n              <input type=\\\"number\\\" min=\\\"0\\\" step=\\\"0.01\\\" value={form.amount_paid} readOnly />\n              <span style={{ fontSize: '12px', opacity: 0.7 }}>Use Record payment to add payment transactions.</span>\n            </label>\n\"\"\"\nnew_amount=\"\"\"            <label>\n              Amount paid\n              <input\n                type=\\\"number\\\"\n                min=\\\"0\\\"\n                step=\\\"0.01\\\"\n                max={form.status === 'void' ? undefined : Math.max(Number(form.total || 0), 0)}\n                value={form.amount_paid}\n                onChange={(e) => updateField('amount_paid', e.target.value)}\n              />\n              <span style={{ fontSize: '12px', opacity: 0.7 }}>\n                Balance due: {money(liveBalanceDue)} · Status: {invoiceStatusLabel(liveInvoiceStatus)}\n              </span>\n              <span style={{ fontSize: '12px', opacity: 0.7 }}>\n                Enter the corrected total amount received. This adjusts the invoice balance without changing individual payment transactions.\n              </span>\n            </label>\n\"\"\"\nif old_amount not in s: raise SystemExit('Amount paid field not found')\ns=s.replace(old_amount,new_amount,1)\nold_update=\"\"\"    if (updateError) {\n      setError(updateError.message)\n      setSaving(false)\n      return\n    }\n\n    setSaving(false)\n    setEditing(false)\n    await load()\n\"\"\"\nnew_update=\"\"\"    if (updateError) {\n      setError(updateError.message)\n      setSaving(false)\n      return\n    }\n\n    const previousAmountPaid = Number(invoice.amount_paid || 0)\n    if (Math.abs(previousAmountPaid - amountPaid) > 0.001) {\n      await logCrmActivity({\n        customer_id: invoice.customer_id,\n        job_id: invoice.job_id,\n        invoice_id: invoice.id,\n        activity_type: 'invoice_payment_adjustment',\n        subject: `Invoice payment amount corrected: ${invoice.invoice_number || 'Invoice'}`,\n        body: `Amount paid corrected from ${money(previousAmountPaid)} to ${money(amountPaid)}.`,\n      })\n    }\n\n    setSaving(false)\n    setEditing(false)\n    await load()\n\"\"\"\nif old_update not in s: raise SystemExit('Invoice update completion block not found')\ns=s.replace(old_update,new_update,1)\np.write_text(s,encoding='utf-8')\nprint('Invoice amount paid editing patch applied.')\nPY"
        },
        {
          "name": "Build CRM",
          "working-directory": "qvbit-site/crm",
          "run": "npm install --no-audit --no-fund && npm run build"
        },
        {
          "name": "Commit and remove workflow",
          "shell": "bash",
          "run": "git config user.name 'github-actions[bot]' && git config user.email '41898282+github-actions[bot]@users.noreply.github.com' && git rm .github/workflows/patch-invoice-amount-paid.yml && git add qvbit-site/crm/src/main.jsx && git commit -m 'Enable editable invoice amount paid' && git push"
        }
      ]
    }
  }
}
