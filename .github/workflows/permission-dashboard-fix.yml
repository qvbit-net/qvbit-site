name: Fix dashboard create controls

on:
  push:
    branches: [main]

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Update dashboard RBAC
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('qvbit-site/crm/src/main.jsx')
          s = p.read_text(encoding='utf-8')

          old = "function Dashboard() {\n  const navigate = useNavigate()"
          new = "function Dashboard({ permissions = {}, isOwner = false }) {\n  const navigate = useNavigate()\n\n  const canCreateLead = isOwner || permissions.leads?.can_create === true\n  const canCreateCustomer = isOwner || permissions.customers?.can_create === true"
          if old not in s:
              raise SystemExit('Dashboard function marker not found')
          s = s.replace(old, new, 1)

          old = '''        action={\n          <div className="quick-actions">\n            <a className="secondary-button" href="/crm/leads">\n              <Plus size={16} />\n              New lead\n            </a>\n            <a className="primary-button" href="/crm/customers">\n              <Plus size={16} />\n              New customer\n            </a>\n          </div>\n        }'''
          new = '''        action={\n          (canCreateLead || canCreateCustomer) ? (\n            <div className="quick-actions">\n              {canCreateLead && (\n                <a className="secondary-button" href="/crm/leads">\n                  <Plus size={16} />\n                  New lead\n                </a>\n              )}\n              {canCreateCustomer && (\n                <a className="primary-button" href="/crm/customers">\n                  <Plus size={16} />\n                  New customer\n                </a>\n              )}\n            </div>\n          ) : null\n        }'''
          if old not in s:
              raise SystemExit('Dashboard quick action block not found')
          s = s.replace(old, new, 1)

          old = '<Route\n              index\n              element={<Dashboard />}\n            />'
          new = '<Route\n              index\n              element={<Dashboard permissions={permissions} isOwner={isOwner} />}\n            />'
          if old not in s:
              raise SystemExit('Dashboard route marker not found')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Build CRM
        working-directory: qvbit-site/crm
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Commit change and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qvbit-site/crm/src/main.jsx .github/workflows/permission-dashboard-fix.yml
          git commit -m 'Enforce dashboard create permissions' || true
          git rm .github/workflows/permission-dashboard-fix.yml || true
          git commit -m 'Remove temporary dashboard RBAC workflow' || true
          git push || true
