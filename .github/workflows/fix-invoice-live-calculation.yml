{"name":"Fix invoice live calculation","on":{"push":{"branches":["main"]}},"permissions":{"contents":"write"},"jobs":{"patch":{"runs-on":"ubuntu-latest","steps":[{"uses":"actions/checkout@v4"},{"name":"Fix live balance display","run":"python3 - <<'PY'\nfrom pathlib import Path\np=Path('qvbit-site/crm/src/main.jsx')\ns=p.read_text(encoding='utf-8')\nold=\"\"\"              <span style={{ fontSize: '12px', opacity: 0.7 }}>\n                Balance due: {money(liveBalanceDue)} · Status: {invoiceStatusLabel(liveInvoiceStatus)}\n              </span>\n\"\"\"\nnew=\"\"\"              <span style={{ fontSize: '12px', opacity: 0.7 }}>\n                Balance due: {money(Math.max(Number(form.total || 0) - Number(form.amount_paid || 0), 0))} · Status: {invoiceStatusLabel(\n                  form.status === 'void'\n                    ? 'void'\n                    : Number(form.amount_paid || 0) >= Number(form.total || 0) && Number(form.total || 0) > 0\n                      ? 'paid'\n                      : Number(form.amount_paid || 0) > 0\n                        ? 'partial'\n                        : ['paid', 'partial'].includes(form.status)\n                          ? 'sent'\n                          : form.status\n                )}\n              </span>\n\"\"\"\nif old not in s: raise SystemExit('live balance display not found')\ns=s.replace(old,new,1)\np.write_text(s,encoding='utf-8')\nprint('Live invoice balance/status calculation fixed.')\nPY"},{"name":"Build CRM","working-directory":"qvbit-site/crm","run":"npm install --no-audit --no-fund && npm run build"},{"name":"Commit and remove workflow","run":"git config user.name 'github-actions[bot]' && git config user.email '41898282+github-actions[bot]@users.noreply.github.com' && git add qvbit-site/crm/src/main.jsx && git commit -m 'Fix live invoice payment calculation' && git rm .github/workflows/fix-invoice-live-calculation.yml && git commit -m 'Remove invoice live calculation workflow' && git push"}]}}}