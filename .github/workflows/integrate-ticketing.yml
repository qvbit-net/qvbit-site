name: Integrate CRM ticketing
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate ticketing route and navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('qvbit-site/crm/src/main.jsx')
          s = p.read_text()
          if "import Ticketing from './components/Ticketing'" not in s:
              s = s.replace("import EmailAttachmentPicker from './components/EmailAttachmentPicker'", "import EmailAttachmentPicker from './components/EmailAttachmentPicker'\nimport Ticketing from './components/Ticketing'")
          if "to: '/crm/tickets'" not in s:
              marker = "  {\n    to: '/crm/services',\n    label: 'Services',\n    icon: Package,\n  },"
              addition = marker + "\n  {\n    to: '/crm/tickets',\n    label: 'Tickets',\n    icon: MessageSquare,\n  },"
              if marker not in s: raise SystemExit('navigation marker not found')
              s = s.replace(marker, addition, 1)
          if 'path="tickets"' not in s:
              marker = "            <Route\n              path=\"services\"\n              element={<Services />}\n            />"
              addition = marker + "\n\n            <Route\n              path=\"tickets\"\n              element={<Ticketing />}\n            />"
              if marker not in s: raise SystemExit('route marker not found')
              s = s.replace(marker, addition, 1)
          p.write_text(s)
          PY
      - name: Build CRM
        working-directory: qvbit-site/crm
        run: |
          npm install
          npm run build
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qvbit-site/crm/src/main.jsx qvbit-site/crm/src/components/Ticketing.jsx
          git commit -m 'Add CRM ticketing tab and workspace' || true
          git push
          rm -f .github/workflows/integrate-ticketing.yml
          git add .github/workflows/integrate-ticketing.yml
          git commit -m 'Remove ticketing integration workflow' || true
          git push || true
