name: Apply completed ticket deletion
on:
  push:
    paths:
      - '.github/workflows/run-ticket-delete.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch ticket interface
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('qvbit-site/crm/src/components/Ticketing.jsx')
          text = path.read_text()
          if 'async function deleteTicket()' not in text:
            marker = '  async function addNote(event) {'
            addition = '''  async function deleteTicket() {
            if (!selected || !['resolved', 'closed'].includes(selected.status)) return
            if (!window.confirm(`Delete ticket #${selected.ticket_number}? This cannot be undone.`)) return
            setBusy(true); setError('')
            try {
              const childDeletes = await Promise.all([
                supabase.from('ticket_notes').delete().eq('ticket_id', selected.id),
                supabase.from('ticket_messages').delete().eq('ticket_id', selected.id),
                supabase.from('ticket_attachments').delete().eq('ticket_id', selected.id),
              ])
              const childError = childDeletes.find((result) => result.error)?.error
              if (childError) throw childError
              const { error: deleteError } = await supabase.from('tickets').delete().eq('id', selected.id)
              if (deleteError) throw deleteError
              setSelected(null); setNotes([]); setMessages([])
              await loadTickets()
            } catch (deleteError) {
              setError(deleteError.message || 'Ticket could not be deleted.')
            } finally {
              setBusy(false)
            }
          }

'''
            if marker not in text:
              raise SystemExit('Insertion marker not found')
            text = text.replace(marker, addition + marker, 1)
          marker = '</select></div><div className="detail-grid">'
          replacement = '</select>{[\'resolved\', \'closed\'].includes(selected.status) && <button type="button" className="danger-button" onClick={deleteTicket} disabled={busy}>Delete ticket</button>}</div><div className="detail-grid">'
          if 'className="danger-button"' not in text:
            if marker not in text:
              raise SystemExit('Header marker not found')
            text = text.replace(marker, replacement, 1)
          path.write_text(text)

          css = Path('qvbit-site/crm/src/components/ticketing.css')
          styles = css.read_text()
          if '.danger-button {' not in styles:
            css.write_text(styles + '\n.danger-button { border: 1px solid #f0caca; background: #fff1f1; color: #a33d3d; border-radius: 8px; padding: 10px 12px; font-weight: 800; cursor: pointer; }\n.danger-button:hover { background: #ffe4e4; }\n')
          PY
      - name: Build and verify
        run: |
          bash qvbit-site/build.sh
          grep -q 'async function deleteTicket' qvbit-site/crm/src/components/Ticketing.jsx
          grep -q 'Delete ticket' qvbit-site/crm/src/components/Ticketing.jsx
          grep -q 'danger-button' qvbit-site/crm/src/components/ticketing.css
          test -f qvbit-site/crm/dist/index.html
      - name: Commit and clean up
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qvbit-site/crm/src/components/Ticketing.jsx qvbit-site/crm/src/components/ticketing.css
          git commit -m 'Add delete action for completed tickets'
          git rm .github/workflows/run-ticket-delete.yml
          git rm .github/workflows/add-ticket-delete.yml || true
          git commit -m 'Remove temporary ticket deletion workflows'
          git push
