name: Verify RBAC build final

on:
  push:
    paths:
      - '.github/workflows/verify-rbac-build-final.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        working-directory: qvbit-site/crm
        run: npm install --no-audit --no-fund
      - name: Build CRM
        working-directory: qvbit-site/crm
        run: npm run build
      - name: Remove workflow
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/verify-rbac-build-final.yml
          git commit -m 'Verify final RBAC build' || true
          git push || true
