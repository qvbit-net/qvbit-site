name: One-time government contracting integration

on:
  push:
    paths:
      - .github/trigger-government-contracting

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Integrate panel into assets and contracts page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('qvbit-site/crm/src/components/MspAssetsContracts.jsx')
          text = path.read_text(encoding='utf-8')
          import_line = "import GovernmentContractingPanel from './GovernmentContractingPanel'"
          if import_line not in text:
              anchor = "import { supabase } from '../supabase'\n"
              if anchor not in text:
                  raise SystemExit('Could not find Supabase import anchor in MspAssetsContracts.jsx')
              text = text.replace(anchor, anchor + import_line + "\n", 1)
          marker = '  return <section className="page-section">\n'
          panel = '  return <section className="page-section">\n    <GovernmentContractingPanel />\n'
          if '<GovernmentContractingPanel />' not in text:
              if marker not in text:
                  raise SystemExit('Could not find page-section return marker in MspAssetsContracts.jsx')
              text = text.replace(marker, panel, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate integration
        run: |
          grep -q "GovernmentContractingPanel" qvbit-site/crm/src/components/MspAssetsContracts.jsx
          test -f qvbit-site/crm/src/components/GovernmentContractingPanel.jsx

      - name: Commit integration and remove one-time trigger
        run: |
          git config user.name "qvb-it-automation"
          git config user.email "automation@qvbit.net"
          rm -f .github/trigger-government-contracting .github/workflows/patch-government-contracting.yml
          git add -A
          git commit -m "Integrate government contracting workspace [skip ci]"
          git push origin main
