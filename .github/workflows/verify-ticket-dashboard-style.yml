name: Verify ticket dashboard style
on:
  push:
    paths:
      - 'qvbit-site/crm/src/components/Ticketing.jsx'
      - 'qvbit-site/crm/src/components/ticketing.css'
      - '.github/workflows/verify-ticket-dashboard-style.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build CRM
        run: bash qvbit-site/build.sh
      - name: Verify ticket styling
        run: |
          test -f qvbit-site/crm/dist/index.html
          grep -q "ticketing.css" qvbit-site/crm/src/components/Ticketing.jsx
          grep -q "ticket-section-header" qvbit-site/crm/src/components/ticketing.css
          grep -q "panel-card" qvbit-site/crm/src/components/ticketing.css
      - name: Remove verification workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/verify-ticket-dashboard-style.yml
          git commit -m 'Remove ticket dashboard style verification workflow'
          git push
