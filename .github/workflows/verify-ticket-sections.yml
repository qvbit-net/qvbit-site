name: Verify ticket sections
on:
  push:
    paths:
      - 'qvbit-site/crm/src/components/Ticketing.jsx'
      - '.github/workflows/verify-ticket-sections.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build CRM
        run: bash qvbit-site/build.sh
      - name: Verify ticket sections
        run: |
          test -f qvbit-site/crm/dist/index.html
          grep -q "New tickets" qvbit-site/crm/src/components/Ticketing.jsx
          grep -q "In progress" qvbit-site/crm/src/components/Ticketing.jsx
          grep -q "Completed" qvbit-site/crm/src/components/Ticketing.jsx
          grep -q "aria-expanded" qvbit-site/crm/src/components/Ticketing.jsx
      - name: Remove verification workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/verify-ticket-sections.yml
          git commit -m 'Remove ticket section verification workflow'
          git push
