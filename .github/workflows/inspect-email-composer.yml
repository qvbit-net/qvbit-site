name: Inspect email composer

on:
  push:
    paths:
      - '.github/workflows/inspect-email-composer.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print email composer context
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('qvbit-site/crm/src/main.jsx').read_text()
          for needle in ['Attach files', 'EmailAttachmentPicker', 'To', 'send-email']:
              print(f'===== {needle} =====')
              start = 0
              count = 0
              while True:
                  pos = text.find(needle, start)
                  if pos < 0 or count >= 5:
                      break
                  print(text[max(0, pos-1800):pos+2500])
                  print('\n--- MATCH END ---\n')
                  start = pos + len(needle)
                  count += 1
          PY
